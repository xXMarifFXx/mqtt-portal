# /etc/nginx/sites-available/mqtt-portal  (symlink into sites-enabled)
# HTTPS reverse proxy in front of the Node app on 127.0.0.1:3000.
# Get the cert with:  sudo certbot --nginx -d portal.example.com

server {
    listen 80;
    server_name portal.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name portal.example.com;

    ssl_certificate     /etc/letsencrypt/live/portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;

    # small app; cap body size and add basic protection
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
