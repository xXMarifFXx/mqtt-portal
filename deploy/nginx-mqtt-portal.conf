# /etc/nginx/sites-available/mqtt-portal  (symlink into sites-enabled)
# HTTPS reverse proxy in front of the Node app on 127.0.0.1:3000.
#
# SINGLE-DOMAIN setup: the portal (443), the MQTT-TLS broker (8883) and the
# MQTT-over-WebSocket broker (8084) all share mqtt.mariffb.my and the ONE Let's
# Encrypt cert that mosquitto-setup.sh already obtained — so nginx just reuses it
# (no second certbot run). Replace mqtt.mariffb.my below.

server {
    listen 80;
    server_name mqtt.mariffb.my;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name mqtt.mariffb.my;

    ssl_certificate     /etc/letsencrypt/live/mqtt.mariffb.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.mariffb.my/privkey.pem;

    client_max_body_size 16k;   # small app; cap request bodies

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
